name: echo_client
description: Echo cross-platform Flutter client. Vignette-driven personality-discovery game.
publish_to: none
version: 0.1.0+1

# Pinned to match .tool-versions at the repo root.
environment:
  sdk: ^3.6.2
  flutter: ^3.44.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — see docs/06_Tech_Stack.md §"Mobile and desktop client".
  flutter_riverpod: ^2.6.1

  # Routing.
  go_router: ^14.6.2

  # HTTP client for the core-go gateway.
  dio: ^5.7.0

  # Internationalisation utilities.
  intl: ^0.20.2

  # Result/Either type for explicit error plumbing; tiny, no extra deps.
  fpdart: ^1.1.1

  cupertino_icons: ^1.0.8

  # Offline-first local store per docs/06 §"Drift · Local persistence".
  # Used in M1 (T-CLIENT-011) to queue choice events for the background
  # sync in T-CLIENT-012, and to cache fetched Seasons so the vignette
  # renderer keeps working without connectivity.
  drift: ^2.21.0
  drift_flutter: ^0.2.4

  # Stable id generation for local-only rows (eg local playthroughs).
  uuid: ^4.5.1

  # Native filesystem location for content-addressed GLB caching. Drift
  # already uses path_provider transitively, but the asset cache imports it
  # directly and therefore declares it explicitly.
  path_provider: ^2.1.5

  # OAuth browser redirect (Google sign-in / sign-up).
  url_launcher: ^6.3.1

  # Session-token persistence across app restarts. Uses Keychain on Apple
  # platforms, Keystore-backed encryption on Android, and WebCrypto on web.
  # New top-level dependency: authentication tokens must not be stored in
  # general-purpose preferences.
  flutter_secure_storage: ^10.1.0

  # System share sheet on iOS/Android/macOS for the Portrait sharing
  # flow (T-CLIENT-030). The plugin handles platform-channel plumbing
  # so we can hand it bytes + a public URL and let the OS render the
  # native picker. New top-level dep — justification in the PR
  # description.
  share_plus: ^10.1.4

  # In-app purchase plugin for Echo+ subscription.
  # Handles Apple StoreKit2 (iOS/macOS) and Google Play Billing (Android).
  # On desktop (Windows/macOS direct download) the client redirects to
  # Stripe Checkout instead (T-MONEY-001).
  # New top-level dep — justified: the only maintained Flutter IAP plugin
  # that supports all four target platforms with a single API surface.
  # https://pub.dev/packages/in_app_purchase
  in_app_purchase: ^3.2.0

  # Primary native 3D renderer selected by docs/06.
  # New top-level dependency: required for Filament-backed GLB scenes.
  thermion_flutter: 0.3.4

  # WebView/<model-viewer> fallback when Thermion cannot initialize, and the
  # active renderer for Flutter web.
  # 1.9.2 is the newest release compatible with Flutter's pinned path 1.9.0.
  # New top-level dependency: required by T-CLIENT-040's fallback contract.
  model_viewer_plus: 1.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Drift codegen + build_runner for it. Build runs as part of
  # `make flutter-codegen` and is wired into CI before `flutter analyze`.
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

  # Golden tests for Portrait rendering land in M1 (T-CLIENT-021). We'll select a
  # maintained replacement for the discontinued `golden_toolkit` then.

flutter:
  uses-material-design: true
  generate: true

  # Bundled content (T-CLIENT-041). The backdrops asset bundle is a
  # build-time mirror of content/backdrops/; keep in sync with
  # `make client-content-sync`. Once the M2 asset loader lands, GLBs
  # stream from the CDN and only the backdrop manifest stays bundled.
  assets:
    - assets/backdrops/season-001/backdrops.manifest.json
    - assets/assets-3d/season-001/assets.manifest.json
    # Explorable 3D scene manifests (T-CLIENT-201): per-asset transforms +
    # anchors and a bounded camera rig. Build-time mirror of content/scenes/;
    # keep in sync with `make client-content-sync`.
    - assets/scenes/season-001/scenes.manifest.json
    # Dev-only placeholder GLB used by AssetFileStore when there is no
    # CDN configured and no on-disk cache hit. Regenerate deterministically
    # with `python3 apps/client/assets/3d/dev/gen_placeholder.py`. Stripped
    # from release builds by the file store's kDebugMode gate.
    - assets/3d/dev/placeholder.glb
